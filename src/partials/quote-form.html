<form id="quote-form" action="[PLACEHOLDER: form endpoint]" method="post" novalidate class="mt-8">

          <p id="form-summary" role="alert" class="mb-6 hidden rounded-md border-l-4 border-[#b42318] bg-[#fef3f2] px-4 py-3 text-sm font-medium text-[#912018]"></p>

          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="name" class="field-label">Full name <span class="text-[#b42318]" aria-hidden="true">*</span></label>
              <input id="name" name="name" type="text" autocomplete="name" required class="field">
              <p id="name-error" class="field-error" role="alert">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg><span data-error-text></span>
              </p>
            </div>

            <div>
              <label for="company" class="field-label">Company <span class="text-[#b42318]" aria-hidden="true">*</span></label>
              <input id="company" name="company" type="text" autocomplete="organization" required class="field">
              <p id="company-error" class="field-error" role="alert">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg><span data-error-text></span>
              </p>
            </div>

            <div>
              <label for="phone" class="field-label">Phone <span class="text-[#b42318]" aria-hidden="true">*</span></label>
              <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required pattern="[0-9+()\s-]{7,}" class="field" aria-describedby="phone-hint">
              <p id="phone-hint" class="mt-1 text-xs text-steel-strong">Include the country code, e.g. +971</p>
              <p id="phone-error" class="field-error" role="alert">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg><span data-error-text></span>
              </p>
            </div>

            <div>
              <label for="email" class="field-label">Email <span class="text-[#b42318]" aria-hidden="true">*</span></label>
              <input id="email" name="email" type="email" autocomplete="email" required class="field">
              <p id="email-error" class="field-error" role="alert">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg><span data-error-text></span>
              </p>
            </div>

            <div class="sm:col-span-2">
              <label for="requirement" class="field-label">What do you need? <span class="text-[#b42318]" aria-hidden="true">*</span></label>
              <select id="requirement" name="requirement" required class="field">
                <option value="">Select a requirement</option>
                <option value="eot-crane">EOT crane — single or double girder</option>
                <option value="gantry-crane">Gantry or semi-gantry crane</option>
                <option value="jib-crane">Jib crane — wall or pillar mounted</option>
                <option value="hoist">Wire rope hoist (MT-series)</option>
                <option value="spare-parts">Spare parts</option>
                <option value="installation">Installation or refurbishment</option>
                <option value="amc">Annual Maintenance Contract</option>
                <option value="emergency">Emergency breakdown</option>
                <option value="other">Something else</option>
              </select>
              <p id="requirement-error" class="field-error" role="alert">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg><span data-error-text></span>
              </p>
            </div>

            <div class="sm:col-span-2">
              <label for="message" class="field-label">Details <span class="text-[#b42318]" aria-hidden="true">*</span></label>
              <textarea id="message" name="message" rows="5" required class="field" aria-describedby="message-hint"></textarea>
              <p id="message-hint" class="mt-1 text-xs text-steel-strong">Span, capacity, lifting height, how often you lift, and the emirate you are in.</p>
              <p id="message-error" class="field-error" role="alert">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg><span data-error-text></span>
              </p>
            </div>
          </div>

          <button type="submit" class="btn btn-primary group mt-7 w-full sm:w-auto">
            Send Quote Request
            <svg class="icon icon-sm transition-transform duration-200 group-hover:translate-x-1" aria-hidden="true"><use href="#i-arrow-right"/></svg>
          </button>
          <p class="mt-3 text-xs text-steel-strong">We use your details to answer this enquiry. Fields marked * are required.</p>
        </form>
