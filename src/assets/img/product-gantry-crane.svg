<!-- REPLACE: real Aerolift photo — gantry crane installation, 800x600 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Diagram of a double girder gantry crane running on floor rails">
  <rect width="800" height="600" fill="#eef1f6"/>
  <g stroke="#c3cddd" stroke-width="2">
    <path d="M0 120 H800"/><path d="M0 240 H800"/><path d="M0 360 H800"/><path d="M0 480 H800"/>
  </g>
  <!-- top girder -->
  <g fill="#16305e">
    <rect x="90" y="110" width="620" height="16"/>
    <rect x="90" y="150" width="620" height="16"/>
  </g>
  <rect x="90" y="126" width="620" height="24" fill="#2b4c8c"/>
  <rect x="90" y="126" width="620" height="7" fill="#f5a800"/>
  <!-- A-frame legs -->
  <g stroke="#16305e" stroke-width="18" stroke-linecap="square" fill="none">
    <path d="M124 166 L96 486"/>
    <path d="M124 166 L188 486"/>
    <path d="M676 166 L704 486"/>
    <path d="M676 166 L612 486"/>
  </g>
  <g stroke="#16305e" stroke-width="10">
    <path d="M108 356 H176"/><path d="M624 356 H692"/>
  </g>
  <!-- sills + wheels -->
  <g fill="#16305e">
    <rect x="76" y="486" width="132" height="18"/>
    <rect x="592" y="486" width="132" height="18"/>
  </g>
  <g fill="#6b7280">
    <circle cx="102" cy="516" r="14"/><circle cx="182" cy="516" r="14"/>
    <circle cx="618" cy="516" r="14"/><circle cx="698" cy="516" r="14"/>
  </g>
  <!-- trolley -->
  <rect x="352" y="88" width="106" height="16" fill="#16305e"/>
  <rect x="360" y="104" width="90" height="48" fill="#f5a800"/>
  <rect x="360" y="104" width="90" height="9" fill="#d99400"/>
  <g stroke="#16305e" stroke-width="4">
    <path d="M382 166 V320"/><path d="M428 166 V320"/>
  </g>
  <rect x="368" y="320" width="74" height="26" rx="3" fill="#16305e"/>
  <path d="M405 346 v30 a20 20 0 1 0 -17 -10" fill="none" stroke="#16305e" stroke-width="8" stroke-linecap="round"/>
  <!-- rails -->
  <rect x="0" y="530" width="800" height="70" fill="#dbe1ea"/>
  <g fill="#f5a800"><rect x="0" y="530" width="800" height="5"/></g>
</svg>
