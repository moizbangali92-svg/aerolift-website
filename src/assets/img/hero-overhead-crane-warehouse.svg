<!-- REPLACE: real Aerolift photo — overhead EOT crane in a customer facility, shot wide, 2400x1350 min, exported to WebP under 150KB. Keep the navy overlay for text contrast. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Double girder overhead travelling crane spanning a warehouse bay, hook block lowered over stacked steel plate">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08152e"/>
      <stop offset="52%" stop-color="#17356a"/>
      <stop offset="100%" stop-color="#0b1c3c"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.66" cy="0.3" r="0.62">
      <stop offset="0%" stop-color="#6d8ec9" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#3f6bb5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3f6bb5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f42"/>
      <stop offset="100%" stop-color="#060f21"/>
    </linearGradient>
    <linearGradient id="girder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a76c0"/>
      <stop offset="100%" stop-color="#26467f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#bloom)"/>

  <!-- roof trusses -->
  <g stroke="#5b83c4" stroke-opacity="0.55" stroke-width="3" fill="none">
    <path d="M0 150 H1600"/>
    <path d="M0 92 H1600"/>
    <path d="M0 92 L100 150 L200 92 L300 150 L400 92 L500 150 L600 92 L700 150 L800 92 L900 150 L1000 92 L1100 150 L1200 92 L1300 150 L1400 92 L1500 150 L1600 92"/>
  </g>
  <g stroke="#5b83c4" stroke-opacity="0.35" stroke-width="3">
    <path d="M240 150 V300"/><path d="M640 150 V300"/><path d="M1040 150 V300"/><path d="M1440 150 V300"/>
  </g>

  <!-- structural columns + runway beams -->
  <g fill="#22406f">
    <rect x="90" y="300" width="54" height="470"/>
    <rect x="1456" y="300" width="54" height="470"/>
  </g>
  <g fill="#1b3560">
    <rect x="404" y="330" width="34" height="440"/>
    <rect x="1162" y="330" width="34" height="440"/>
  </g>
  <g fill="#2e5391">
    <rect x="60" y="286" width="1480" height="26"/>
  </g>
  <rect x="60" y="312" width="1480" height="9" fill="#16305e"/>

  <!-- crane bridge: two girders + end carriages -->
  <g>
    <rect x="118" y="232" width="1364" height="18" fill="#5b83c4"/>
    <rect x="118" y="250" width="1364" height="10" fill="#f5a800"/>
    <rect x="118" y="260" width="1364" height="40" fill="url(#girder)"/>
    <rect x="118" y="300" width="1364" height="10" fill="#152c56"/>
    <rect x="96" y="218" width="88" height="98" fill="#2e5391"/>
    <rect x="1416" y="218" width="88" height="98" fill="#2e5391"/>
    <rect x="96" y="218" width="88" height="9" fill="#6d8ec9"/>
    <rect x="1416" y="218" width="88" height="9" fill="#6d8ec9"/>
    <g fill="#8fa9d6">
      <circle cx="126" cy="316" r="15"/><circle cx="154" cy="316" r="15"/>
      <circle cx="1446" cy="316" r="15"/><circle cx="1474" cy="316" r="15"/>
    </g>
  </g>

  <!-- trolley + hoist -->
  <g>
    <rect x="836" y="210" width="176" height="26" fill="#2e5391"/>
    <rect x="850" y="236" width="148" height="80" fill="#f5a800"/>
    <rect x="850" y="236" width="148" height="13" fill="#ffc23d"/>
    <rect x="850" y="304" width="148" height="12" fill="#c98a00"/>
    <rect x="876" y="258" width="96" height="34" rx="3" fill="#16305e"/>
    <!-- rope reeving -->
    <g stroke="#adc0dd" stroke-width="5">
      <path d="M886 316 V596"/><path d="M962 316 V596"/>
    </g>
    <!-- hook block -->
    <rect x="860" y="592" width="128" height="46" rx="4" fill="#2e5391"/>
    <rect x="860" y="592" width="128" height="12" fill="#f5a800"/>
    <path d="M924 638 v44 a32 32 0 1 0 -28 -16" fill="none" stroke="#adc0dd" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- load: stacked steel plate -->
  <g>
    <rect x="700" y="742" width="520" height="20" fill="#22406f"/>
    <rect x="700" y="742" width="520" height="5" fill="#5b83c4"/>
    <rect x="726" y="710" width="468" height="32" fill="#1b3560"/>
    <rect x="726" y="710" width="468" height="5" fill="#4a76c0"/>
    <rect x="752" y="682" width="416" height="28" fill="#22406f"/>
    <rect x="752" y="682" width="416" height="5" fill="#5b83c4"/>
  </g>

  <!-- steel coils -->
  <g fill="#1b3560" stroke="#4a76c0" stroke-width="4">
    <ellipse cx="304" cy="716" rx="86" ry="52"/>
    <ellipse cx="452" cy="734" rx="70" ry="42"/>
  </g>
  <g fill="#0d1f42">
    <ellipse cx="304" cy="716" rx="26" ry="16"/>
    <ellipse cx="452" cy="734" rx="21" ry="13"/>
  </g>

  <!-- floor -->
  <rect x="0" y="762" width="1600" height="138" fill="url(#floor)"/>
  <rect x="0" y="762" width="1600" height="4" fill="#4a76c0" opacity="0.7"/>
  <g stroke="#f5a800" stroke-opacity="0.5" stroke-width="6">
    <path d="M0 796 H1600"/>
  </g>
  <g stroke="#3f6bb5" stroke-opacity="0.35" stroke-width="3">
    <path d="M0 840 H1600"/><path d="M0 874 H1600"/>
  </g>
</svg>
