<!-- REPLACE: real Aerolift photo — installed EOT crane, 800x600 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Diagram of a double girder EOT overhead travelling crane on runway beams">
  <rect width="800" height="600" fill="#eef1f6"/>
  <g stroke="#c3cddd" stroke-width="2">
    <path d="M0 120 H800"/><path d="M0 240 H800"/><path d="M0 360 H800"/><path d="M0 480 H800"/>
  </g>
  <!-- runway columns -->
  <g fill="#d5dce8">
    <rect x="60" y="180" width="40" height="320"/>
    <rect x="700" y="180" width="40" height="320"/>
  </g>
  <!-- runway beams -->
  <g fill="#16305e">
    <rect x="40" y="170" width="80" height="20"/>
    <rect x="680" y="170" width="80" height="20"/>
  </g>
  <!-- bridge girders -->
  <g fill="#16305e">
    <rect x="70" y="120" width="660" height="14"/>
    <rect x="70" y="152" width="660" height="14"/>
    <rect x="66" y="106" width="52" height="76"/>
    <rect x="682" y="106" width="52" height="76"/>
  </g>
  <rect x="70" y="134" width="660" height="18" fill="#2b4c8c"/>
  <!-- wheels -->
  <g fill="#6b7280">
    <circle cx="82" cy="188" r="12"/><circle cx="106" cy="188" r="12"/>
    <circle cx="698" cy="188" r="12"/><circle cx="722" cy="188" r="12"/>
  </g>
  <!-- trolley -->
  <rect x="360" y="98" width="110" height="16" fill="#16305e"/>
  <rect x="368" y="114" width="94" height="52" fill="#f5a800"/>
  <rect x="368" y="114" width="94" height="9" fill="#d99400"/>
  <!-- rope + hook -->
  <g stroke="#16305e" stroke-width="4">
    <path d="M392 166 V330"/><path d="M438 166 V330"/>
  </g>
  <rect x="378" y="330" width="74" height="26" rx="3" fill="#16305e"/>
  <path d="M415 356 v30 a20 20 0 1 0 -17 -10" fill="none" stroke="#16305e" stroke-width="8" stroke-linecap="round"/>
  <!-- floor -->
  <rect x="0" y="500" width="800" height="100" fill="#dbe1ea"/>
  <rect x="0" y="500" width="800" height="5" fill="#f5a800"/>
</svg>
